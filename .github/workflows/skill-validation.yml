name: Skill Validation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    name: Validate Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate all SKILL.md files
        run: |
          fail=0
          while IFS= read -r f; do
            echo "::group::$f"
            if ! python3 ci/validate.py "$f"; then
              fail=1
            fi
            echo "::endgroup::"
          done < <(find skills -name SKILL.md | sort)
          exit $fail

      - name: Enforce corpus ceiling
        run: python3 ci/check_ceiling.py

      - name: Skill gate check (F-035/F-036)
        run: |
          result=0
          python3 ci/check_skill_gate.py --ci || result=$?
          # exit 2 = WARN (no modified skills) — allowed through
          if [ "$result" -eq 1 ]; then
            echo "BLOCKED: skill gate failed — gates_passed stale or SKILL_VERSION not incremented"
            exit 1
          fi
