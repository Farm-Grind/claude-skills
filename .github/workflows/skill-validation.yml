name: Skill Validation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    name: Validate Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate all SKILL.md files
        run: |
          fail=0
          while IFS= read -r f; do
            echo "::group::$f"
            if ! python3 ci/validate.py "$f"; then
              fail=1
            fi
            echo "::endgroup::"
          done < <(find skills -name SKILL.md | sort)
          exit $fail

      - name: Enforce corpus ceiling
        run: python3 ci/check_ceiling.py
